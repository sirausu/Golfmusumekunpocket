<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>プロテストへの道（ゴルフ育成 試作版）</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f2a1d;--card:#173a29;--line:#2a5a40;--txt:#eef5ee;--mut:#a9c4b0;--acc:#f2c94c;--good:#ff7a7a;--bad:#7ab8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1d4a33,var(--bg) 60%);color:var(--txt);font-family:'M PLUS Rounded 1c',sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:14px 14px 40px}
button{font-family:inherit;color:inherit;cursor:pointer;border:none}
button:disabled{opacity:.38;cursor:default}
.title{text-align:center;padding-top:10px}.title h1{font-family:'DotGothic16','M PLUS Rounded 1c',sans-serif;font-size:32px;margin:10px 0 4px;color:var(--acc);letter-spacing:.08em}
.sub{color:var(--mut);margin:0 0 10px}.lead{color:var(--mut);font-size:13.5px;line-height:1.7}
.big{display:block;width:100%;padding:14px;margin:10px 0;border-radius:14px;background:var(--acc);color:#2a2100;font-weight:800;font-size:17px}
.ghost{display:block;width:100%;padding:11px;margin:8px 0;border-radius:12px;background:transparent;border:1px solid var(--line);color:var(--mut)}
.ghost.sm{display:inline-block;width:auto;padding:8px 14px;margin:0 6px}
.diff{display:block;width:100%;text-align:left;padding:12px 14px;margin:8px 0;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.diff b{font-size:17px;color:var(--acc)}.diff em{font-style:normal;font-size:11px;font-weight:800;background:var(--acc);color:#2a2100;border-radius:20px;padding:1px 9px;margin-left:8px;vertical-align:2px}
.diff span{display:block;font-size:13px;color:var(--mut);line-height:1.6}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.wk{font-weight:800;font-size:18px}.df{font-size:12px;color:var(--mut)}
.money{font-size:22px;font-weight:800;color:var(--acc)}
.stam{display:flex;align-items:center;gap:8px;font-size:13px}.sbar{flex:1;height:10px;background:#0a1d14;border-radius:6px;overflow:hidden}.sbar i{display:block;height:100%}
.sbar.ok i{background:#5ad18a}.sbar.mid i{background:#f2c94c}.sbar.low i{background:#ff6b6b}
.next{margin:8px 0;font-size:12.5px;color:var(--mut);background:#0a1d14;padding:7px 10px;border-radius:10px;line-height:1.6}.next .nc{color:#ffd0a0}
.next{cursor:pointer;position:relative}.callink{float:right;margin-left:8px;color:#2a2100;background:var(--acc);font-weight:800;font-size:12px;padding:1px 9px;border-radius:20px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}.tabs button{padding:9px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-weight:700}.tabs .on{background:var(--acc);color:#2a2100;border-color:var(--acc)}
.tabs.t4{grid-template-columns:repeat(4,1fr);margin-top:12px}
.tabs.t2{grid-template-columns:1fr 1fr}.backtop{margin:0 0 8px;text-align:left;color:var(--txt)}
.minical{background:#0a1d14;border:1px solid var(--line);border-radius:12px;padding:8px 9px;margin-bottom:10px;cursor:pointer}
.mchead{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}.mchead span{color:#2a2100;background:var(--acc);font-weight:800;font-size:11.5px;padding:1px 9px;border-radius:20px}
.mcrow{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 1px 3px;text-align:center;min-height:52px}.mc.cur{border:2px solid var(--acc)}
.mc small{display:block;font-size:9.5px;color:var(--acc);font-weight:800;height:13px}.mc span{display:block;font-size:10.5px;color:var(--mut)}
.mc i{display:block;font-style:normal;font-size:9.5px;font-weight:800;border-radius:3px;margin:2px 1px 0;padding:1px 0}
.mc i.check{background:#5a2f22;color:#ffd0b8}.mc i.amateur{background:#234a63;color:#cfe6f5}.mc i.test{background:#5a4a12;color:#ffe9a8}
.mcnext{font-size:12px;color:var(--mut);margin-top:6px;line-height:1.6}.mcnext .nc{color:#ffd0a0}
.cond{font-size:12px;font-weight:800;padding:1px 8px;border-radius:20px;margin-left:4px;white-space:nowrap}.cond.c0{background:#3a2a5a;color:#b9a8ff}.cond.c1{background:#22324a;color:#9fc0ff}.cond.c2{background:#2a3a2f;color:#cfe0d2}.cond.c3{background:#4a3a12;color:#ffd27a}.cond.c4{background:#5a2222;color:#ff9e9e}
.risk{display:block;font-size:11.5px;font-weight:800;color:#ff9a6b}.cond.inj{background:#5a2222;color:#ffb0b0}
.plan{background:#0a1d14;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0;font-size:12px;color:var(--mut);line-height:1.6}
.ph{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;color:var(--txt)}.ph .ok{color:#9be37a;font-weight:800}.ph .bad{color:#ff8a8a;font-weight:800}
.pi{display:flex;flex-wrap:wrap;gap:4px;margin:5px 0}.pi span{background:var(--card);border-radius:6px;padding:1px 7px;font-size:11px}.pi span.t{background:#5a4a12;color:#ffe9a8}
.tl{font-size:11.5px}.tl b{color:var(--acc)}
.frs{display:flex;flex-wrap:wrap;gap:3px;margin:1px 0}.frs i{font-style:normal;font-size:11px;font-weight:800;background:#f2c94c;color:#2a2100;border-radius:20px;padding:0 7px}
.act:has(.frs){border-color:var(--acc);box-shadow:0 0 0 1px #f2c94c55 inset}
.friends{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin:0 0 8px;font-size:12px}.fb{display:grid;grid-template-columns:70px 1fr 28px;align-items:center;gap:5px;color:var(--mut)}
.bb{height:6px;background:#0a1d14;border-radius:3px;overflow:hidden}.bb i{display:block;height:100%;background:#ff8fa0}.fb small{text-align:right;color:#ff8fa0}
.with{font-size:13px;color:var(--acc);margin-top:4px}
.calgrid{display:grid;grid-template-columns:38px repeat(4,1fr);gap:3px}
.cm{display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:var(--mut);background:#0a1d14;border-radius:6px}
.cc{min-height:46px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 3px}.cc small{display:block;font-size:9px;color:#6f8f7a}
.cc.past{opacity:.5}.cc.cur{border:2px solid var(--acc);opacity:1}
.ce{border-radius:4px;padding:1px 3px;margin-top:1px;font-size:10.5px;line-height:1.3}.ce b{display:block}.ce span{display:block;font-size:10px}
.ce.check{background:#5a2f22;color:#ffd0b8}.ce.amateur{background:#234a63;color:#cfe6f5}.ce.test{background:#5a4a12;color:#ffe9a8}
.cl{display:grid;grid-template-columns:104px 1fr;gap:8px;background:#0a1d14;border-radius:10px;padding:8px 10px;margin-bottom:5px;font-size:12.5px;line-height:1.55;color:#d6e6d9}.cl span{color:var(--mut)}.cl.past{opacity:.5}
.mod{margin:8px 0;padding:9px 11px;border-radius:12px;background:#3a3010;border:1px solid #6b5a1a;font-size:13px;color:#f5e6b0}.mod b{color:var(--acc)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 8px;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"sn sn" "rk sv" "bar bar";align-items:center;column-gap:6px}
.sn{grid-area:sn;font-size:11.5px;color:var(--mut)}.rk{grid-area:rk;font-size:24px;font-weight:800;line-height:1}.sv{grid-area:sv;text-align:right;font-weight:700}.sv small{color:var(--acc);font-size:11px;margin-left:2px}
.bar{grid-area:bar;height:4px;background:#0a1d14;border-radius:3px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.rSS{color:#fff36b;text-shadow:0 0 6px rgba(255,220,80,.8)}.rSP{color:#ffc6f0;text-shadow:0 0 4px rgba(255,157,226,.7)}.rS{color:#ff9de2}.rA{color:#ff7a7a}.rB{color:#ffb35c}.rC{color:#f2c94c}.rD{color:#9be37a}.rE{color:#6fd1c8}.rF{color:#8fb0ff}.rG{color:#9aa}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chips span{background:#0a1d14;border:1px solid var(--line);color:var(--mut);font-size:12px;padding:3px 9px;border-radius:20px}
.chips .sk{background:#3a3010;border-color:#6b5a1a;color:var(--acc)}.chips .warnc{border-color:#a8553a;color:#ffc2a8}
.log{background:#0a1d14;border-radius:12px;padding:9px 11px;font-size:13px;line-height:1.65;margin:8px 0;color:#d6e6d9}
.log.hl{border-left:3px solid var(--acc)}.log.flash{animation:flash .9s}
@keyframes flash{0%{background:#3a3010}100%{background:#0a1d14}}
.cat{font-size:12px;color:var(--mut);margin:12px 2px 5px;font-weight:700}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.act{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;width:100%;margin-bottom:6px}
.acts .act{margin:0}.act b{font-size:14.5px}.act .cost{font-size:12px;color:var(--acc)}.act .desc{font-size:11px;color:var(--mut);line-height:1.45}
.act.job{background:#1f3347}.act.rest{background:#33284a}.act.go{background:#3a2f1c}.act.deal{border-color:var(--acc)}.act:active:not(:disabled){transform:scale(.98)}
.act.cur{border-color:var(--acc)}
.tired{display:block;color:#ff8a8a;font-weight:800}
.ef{font-size:11.5px;font-weight:800}.ef.e3{color:#ff9de2}.ef.e2{color:#9be37a}.ef.e1{color:#f2c94c}.ef.e0{color:#ff8a8a}
.event{background:linear-gradient(160deg,#28533b,#173a29);border:1px solid var(--acc);border-radius:16px;padding:16px;margin-top:12px;text-align:center}
.event h2{margin:6px 0;color:var(--acc)}.event p{color:var(--mut);line-height:1.7;font-size:14px}
.event.check{border-color:#ff9a6b;background:linear-gradient(160deg,#4a2c22,#2a2018)}.event.check h2{color:#ffb08a}
.etag{display:inline-block;background:var(--acc);color:#2a2100;font-size:12px;font-weight:800;padding:2px 10px;border-radius:20px}
.warn{color:#ffb0b0!important;font-size:13px}
.foot{text-align:center;margin-top:18px}
.mhead{display:flex;justify-content:space-between;align-items:center}.tot{font-size:28px;font-weight:800}.tot small{font-size:13px;color:var(--mut);margin-left:4px}
.goal{font-size:13px;color:#ffd0a0;margin-top:4px}
.card{margin:10px 0;background:#f3efe2;color:#222;border-radius:10px;padding:6px}
.row{display:grid;grid-template-columns:repeat(9,1fr);gap:2px}.row+.row{margin-top:3px}
.cell{text-align:center;border-radius:5px;padding:2px 0}.cell small{display:block;font-size:9px;color:#888}.cell span{font-weight:800;font-size:15px}
.cell.cur{background:#ffe08a}.cell.fx{background:#e3f0e6}.cell.fx.cur{background:#ffe08a}.cell .good{color:#d62828}.cell .bad{color:#1d5fbf}
.log .good{color:var(--good)}.log .bad{color:var(--bad)}
.holeinfo{text-align:center;margin:12px 0}.hn{font-size:24px;font-weight:800;color:var(--acc)}.pr{color:#ffb0b0;font-size:13px;margin-top:4px}
.strat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.strat button{padding:14px 6px;border-radius:14px;display:flex;flex-direction:column;gap:4px}.strat b{font-size:17px}.strat span{font-size:10.5px;opacity:.85;line-height:1.4}
.s-atk{background:#a8323a}.s-nor{background:#2f6b4a}.s-safe{background:#2c5687}
.result{text-align:center}.result p{line-height:1.7}.result.win h1,.result.win h2{color:var(--acc)}
.revent{background:var(--card);border:1px solid var(--acc);border-radius:16px;padding:18px 16px;margin-top:14px;text-align:center}
.revent .ico{font-size:46px}.revent h2{margin:4px 0 8px;color:var(--acc)}.revent p{line-height:1.8;font-size:14.5px;margin:0 0 12px}
.doing{text-align:center;font-weight:800;font-size:17px;margin:14px 0 6px}.doing small{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:4px}
/* ---- スクロールなしで遊べる詰めた画面 ---- */
#app{padding:8px 10px 16px}
.cm-main .top{margin-bottom:3px}.cm-main .wk{font-size:15.5px}.cm-main .money{font-size:19px}
.modc{font-style:normal;font-size:11px;background:#3a3010;color:var(--acc);border-radius:20px;padding:0 7px;margin-left:2px;white-space:nowrap}
.cm-main .stam{font-size:12px;margin-bottom:5px}.cm-main .cond{font-size:11.5px;margin-left:0}
.minical{padding:5px 6px;margin-bottom:5px;border-radius:10px}
.mc{min-height:0;padding:2px 0;border-radius:5px}.mc span{font-size:9.5px;line-height:1.3}.mc i{font-size:9px;margin:1px 1px 0;padding:0}
.mcnext{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:11.5px;line-height:1.3;white-space:nowrap;overflow:hidden}.mcnext .bad{color:#ff8a8a}.mcnext .more{margin-left:auto;color:var(--acc);font-weight:800}
.scene-row{display:grid;grid-template-columns:104px 1fr;gap:6px;margin-bottom:5px}
.stage.mini{aspect-ratio:auto;height:66px;margin:0;border-radius:10px}
.scene-row .log{margin:0;height:66px;overflow:hidden;font-size:11.5px;line-height:1.45;padding:5px 8px;border-radius:10px;cursor:pointer}
.scene-row .log.open{height:auto;min-height:66px;position:relative;z-index:2}.modd{color:#f5e6b0}
.cstats{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-bottom:5px}
.cs{background:var(--card);border:1px solid var(--line);border-radius:8px;text-align:center;padding:2px 0 3px;line-height:1.15}.cs small{display:block;font-size:9.5px;color:var(--mut)}.cs b{font-size:17px}.cs span{font-size:11.5px;margin-left:2px}
.chips.one{flex-wrap:nowrap;overflow-x:auto;margin-bottom:5px;gap:4px;scrollbar-width:none}.chips.one span{white-space:nowrap;font-size:11px;padding:1px 8px}
.cm-main .tabs.t4{margin:0 0 5px;gap:4px}.cm-main .tabs button{padding:6px 0;font-size:13.5px;border-radius:9px}
.cm-main .acts{gap:4px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.cm-main .act{min-width:0;overflow:hidden}.cm-main .act .cost{overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cm-main .act{padding:5px 8px;border-radius:10px;gap:0;min-height:58px;justify-content:center}
.cm-main .act b{font-size:13.5px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}.cm-main .frs{display:inline-flex;margin:0}.cm-main .frs i{font-size:10px;padding:0 5px}
.cm-main .act .cost{font-size:11.5px;white-space:nowrap}.cm-main .act .cost em{font-style:normal;font-size:inherit}.cm-main .act .tired{display:inline;font-size:11.5px}.cm-main .risk{display:inline}
.cm-main .act .desc{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cm-main .event{margin-top:6px;padding:12px}
.holeinfo{margin:6px 0;font-size:14px}.hn{font-size:19px}.pr{margin:0}.strat button{padding:10px 6px}
/* 画面に余裕があるスマホでは、文字とボタンを大きくして画面いっぱいに使う */
.cm-main{display:flex;flex-direction:column;min-height:calc(100dvh - 24px)}
.cm-main .acts{flex:1;grid-auto-rows:minmax(58px,1fr);max-height:calc(var(--rows,4)*112px)}
@media (min-height:700px){
.cm-main .wk{font-size:18px}.cm-main .money{font-size:23px}.modc{font-size:12.5px}
.cm-main .stam{font-size:14px;margin-bottom:7px}.cm-main .sbar{height:12px}.cm-main .cond{font-size:13.5px;padding:2px 10px}
.minical{padding:7px 8px;margin-bottom:7px}.mc{padding:4px 0}.mc span{font-size:11.5px}.mc i{font-size:11px;padding:1px 0}.mcnext{font-size:13.5px;margin-top:6px}
.scene-row{grid-template-columns:132px 1fr;margin-bottom:7px}.stage.mini{height:92px}.scene-row .log{height:92px;font-size:13.5px;line-height:1.5;padding:7px 10px}.scene-row .log.open{min-height:92px}
.cstats{gap:4px;margin-bottom:7px}.cs{padding:4px 0 5px}.cs small{font-size:11px}.cs b{font-size:22px}.cs span{font-size:14px}
.chips.one{margin-bottom:7px}.chips.one span{font-size:13px;padding:3px 10px}
.cm-main .tabs.t4{margin-bottom:7px}.cm-main .tabs button{padding:10px 0;font-size:16px}
.cm-main .acts{gap:6px}.cm-main .act{padding:8px 10px;gap:3px}
.cm-main .act b{font-size:16.5px}.cm-main .frs i{font-size:12px;padding:1px 7px}
.cm-main .act .cost,.cm-main .act .tired{font-size:14px}.cm-main .act .desc{font-size:12.5px}
.cm-main .acts.dense{gap:5px}.cm-main .acts.dense .act{padding:5px 9px;gap:0}.cm-main .acts.dense .act b{font-size:15px}
.cm-main .acts.dense .act .cost,.cm-main .acts.dense .act .tired{font-size:12.5px}.cm-main .acts.dense .act .desc{font-size:11px}
}
@media (min-height:700px) and (max-height:800px){.cm-main:has(.dense) .stage.mini,.cm-main:has(.dense) .scene-row .log{height:70px}.cm-main:has(.dense) .tabs button{padding:7px 0}.cm-main:has(.dense) .cs b{font-size:19px}}
/* ---- 普段の画面の絵（横いっぱい）と結果画面 ---- */
.stage.wide{aspect-ratio:auto;height:100px;margin:0 0 5px;border-radius:10px}
@media (min-height:700px){.stage.wide{height:102px;margin-bottom:7px}}@media (min-height:800px){.stage.wide{height:140px}}
.stage.wide .slabel.l2{top:auto;bottom:6px;left:auto;right:8px;max-width:72%;background:#3a3010ee;color:#f5e6b0}
.stage.wide .slabel{font-size:12px;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resv{cursor:pointer;min-height:calc(100dvh - 24px);display:flex;flex-direction:column}
.resv .stage{margin:0 0 8px}.resv .big{margin-top:auto}
.rt{font-family:'DotGothic16','M PLUS Rounded 1c',sans-serif;text-align:center;font-size:24px;margin:2px 0 8px;color:var(--acc);letter-spacing:.06em}
.banner{text-align:center;font-family:'DotGothic16','M PLUS Rounded 1c',sans-serif;font-size:30px;font-weight:800;padding:6px;border-radius:12px;margin-bottom:6px;animation:bang .5s cubic-bezier(.2,2,.4,1) both}
.banner.crit{background:linear-gradient(90deg,#f2c94c,#ff8fa0,#f2c94c);color:#3a1a00;background-size:200% 100%;animation:bang .5s cubic-bezier(.2,2,.4,1) both,shine 1.2s linear infinite}
.banner.hurt{background:#7a1f1f;color:#ffd6d6;animation:shake .5s both}.banner.skill{background:#3a3010;color:var(--acc);border:2px solid var(--acc)}
@keyframes bang{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}@keyframes shine{0%{background-position:0 0}100%{background-position:200% 0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.rs{position:relative;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 8px 7px;text-align:center}
.rs small{display:block;font-size:12px;color:var(--mut)}.rs b{font-size:26px;line-height:1.1}.rs span{font-size:17px;font-weight:700;margin-left:4px}
.rs i{position:absolute;right:-3px;top:-9px;font-style:normal;font-weight:800;font-size:17px;padding:1px 8px;border-radius:20px;animation:popin .5s cubic-bezier(.2,2.2,.4,1) both;animation-delay:var(--d)}
.rs.up{border-color:var(--acc);animation:glow .9s both;animation-delay:var(--d)}.rs.up i{background:var(--acc);color:#2a2100}
.rs.down{border-color:#ff6b6b}.rs.down i{background:#ff6b6b;color:#2a0000}
